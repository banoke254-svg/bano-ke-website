<!DOCTYPE html>
<html>

<head>

<title>BANO KE Website Builder</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

</head>


<body>


<!-- EDITOR BUTTON -->

<button id="editorToggle">
🛠
</button>



<!-- EDITOR PANEL -->

<div id="editorPanel">


<h2>BANO EDITOR</h2>


<button onclick="addText()">
+ Text
</button>


<button onclick="addEmoji()">
+ Emoji
</button>


<button onclick="addImage()">
+ Image
</button>


<button onclick="addGlassPanel()">
+ Glass Panel
</button>



<hr>


<h3>OBJECT</h3>


<button onclick="deleteSelected()">
🗑 Delete
</button>



<button onclick="duplicateSelected()">
📋 Duplicate
</button>




<hr>


<h3>SIZE</h3>


<label>
Width
</label>

<input 
type="range"
id="widthControl"
min="50"
max="1000"
value="300"
>



<label>
Height
</label>


<input 
type="range"
id="heightControl"
min="50"
max="800"
value="200"
>



<hr>


<h3>GLASS</h3>


<label>
Opacity
</label>


<input 
type="range"
id="opacityControl"
min="0"
max="100"
value="50"
>




<label>
Blur
</label>


<input 
type="range"
id="blurControl"
min="0"
max="50"
value="20"
>




<label>
Corners
</label>


<input 
type="range"
id="radiusControl"
min="0"
max="100"
value="30"
>




<hr>



<h3>ANIMATION</h3>



<button onclick="addBounce()">

🪂 Bounce

</button>



<button onclick="removeAnimation()">

Stop

</button>




<hr>


<h3>PAGES</h3>


<button onclick="newPage()">

+ New Page

</button>


<button onclick="nextPage()">

Next Page

</button>



<select id="transitionSelect">

<option value="fade">
Fade
</option>


<option value="zoom">
Zoom
</option>


<option value="morph">
Morph
</option>


<option value="slide">
Slide
</option>


</select>



<button onclick="changePage()">

Apply Transition

</button>



<br><br>


<button onclick="saveWebsite()">

💾 Save

</button>



</div>






<!-- PAGE CONTAINER -->

<div id="website">


<section class="page active" id="page1">


<div class="hero">



<h1 class="object textObject">

BANO KE

</h1>




<p class="object textObject">

THE KING OF AFRICAN MARBLES

</p>




<img

src="assets/marble.png"

class="object imageObject"

id="mainMarble"

>





</div>


</section>



</div>






<script src="animations.js"></script>

<script src="pages.js"></script>

<script src="editor.js"></script>


</body>


</html>
