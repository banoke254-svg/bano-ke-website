<!DOCTYPE html>
<html>

<head>

<title>BANO KE Builder</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

</head>


<body>


<!-- EDIT BUTTON -->

<button id="editorToggle">
🛠
</button>



<!-- TOOL PANEL -->

<div id="editorPanel">


<h2>BANO BUILDER</h2>


<button onclick="addText()">
+ TEXT
</button>


<button onclick="addEmoji()">
+ EMOJI
</button>


<button onclick="addImage()">
+ IMAGE
</button>


<button onclick="addGlass()">
+ GLASS PANEL
</button>



<hr>


<h3>OBJECT</h3>


<button onclick="deleteSelected()">
DELETE
</button>



<button onclick="duplicateSelected()">
DUPLICATE
</button>




<hr>


<h3>SIZE</h3>


<label>
Width
</label>

<input id="widthSlider" type="range" min="20" max="1000">



<label>
Height
</label>

<input id="heightSlider" type="range" min="20" max="1000">





<label>
Text Size
</label>


<input id="fontSlider" type="range" min="10" max="200">






<hr>


<h3>GLASS</h3>


<label>
Opacity
</label>


<input id="opacitySlider" type="range" min="0" max="100">



<label>
Blur
</label>


<input id="blurSlider" type="range" min="0" max="50">



<label>
Corners
</label>


<input id="radiusSlider" type="range" min="0" max="100">





<hr>


<h3>ANIMATION</h3>


<button onclick="bounceObject()">
🪂 BOUNCE
</button>


<button onclick="floatObject()">
🌊 FLOAT
</button>


<button onclick="pulseObject()">
✨ PULSE
</button>



<button onclick="stopAnimation()">
STOP
</button>




<hr>


<h3>PAGES</h3>


<button onclick="createPage()">
+ NEW PAGE
</button>


<button onclick="nextPage()">
NEXT PAGE
</button>



<select id="transition">

<option value="fade">
Fade
</option>


<option value="zoom">
Zoom
</option>


<option value="morph">
Morph
</option>


<option value="slide">
Slide
</option>


</select>



<button onclick="applyTransition()">
APPLY
</button>




</div>






<div id="website">


<section class="page active">


<div class="hero">



<h1 class="editable text">

BANO KE

</h1>



<p class="editable text">

THE KING OF AFRICAN MARBLES

</p>




<img

src="assets/marble.png"

class="editable image"

>



</div>


</section>



</div>






<script src="editor.js"></script>

<script src="animations.js"></script>

<script src="pages.js"></script>



</body>

</html>
