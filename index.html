<!DOCTYPE html>
<html>

<head>

<title>BANO KE Builder</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

</head>


<body>


<!-- ==========================
EDITOR BUTTON
========================== -->


<button id="editorToggle">
🛠
</button>





<!-- ==========================
EDITOR PANEL
========================== -->


<div id="editorPanel">


<h2>
BANO BUILDER
</h2>



<!-- PROJECT -->


<h3>
PROJECT
</h3>


<button onclick="saveProject()">
💾 SAVE PROJECT
</button>


<button onclick="loadProject()">
📂 LOAD PROJECT
</button>





<hr>




<!-- PAGES -->


<h3>
PAGES
</h3>


<button onclick="addPage()">
➕ NEW PAGE
</button>


<button onclick="removePage()">
🗑 REMOVE PAGE
</button>


<button onclick="previousPage()">
⬅ PREVIOUS
</button>


<button onclick="nextPage()">
NEXT ➡
</button>





<select id="pageTransition">


<option value="fade">
Fade
</option>


<option value="zoom">
Zoom
</option>


<option value="morph">
Morph
</option>


<option value="slide">
Slide
</option>


</select>







<hr>




<!-- BACKGROUND -->


<h3>
BACKGROUND
</h3>



<input 
type="file"
id="backgroundUpload"
accept="image/*"
>



<button onclick="applyBackground()">
SET BACKGROUND
</button>



<button onclick="removeBackground()">
REMOVE BACKGROUND
</button>







<hr>





<!-- OBJECTS -->


<h3>
OBJECTS
</h3>



<button onclick="addText()">
➕ TEXT
</button>


<button onclick="addEmoji()">
🔥 EMOJI
</button>


<button onclick="addImage()">
🖼 IMAGE
</button>


<button onclick="addGlassPanel()">
⬜ GLASS PANEL
</button>





<button onclick="deleteSelected()">
🗑 DELETE SELECTED
</button>







<hr>





<!-- SIZE -->


<h3>
SIZE
</h3>



<label>
Width
</label>


<input 
type="range"
id="widthControl"
min="20"
max="1200"
>



<label>
Height
</label>


<input 
type="range"
id="heightControl"
min="20"
max="1000"
>



<label>
Text Size
</label>


<input 
type="range"
id="fontControl"
min="10"
max="200"
>







<hr>






<!-- GLASS SETTINGS -->


<h3>
GLASS
</h3>


<label>
Opacity
</label>


<input 
type="range"
id="opacityControl"
min="0"
max="100"
>



<label>
Blur
</label>


<input 
type="range"
id="blurControl"
min="0"
max="60"
>



<label>
Radius
</label>


<input 
type="range"
id="radiusControl"
min="0"
max="100"
>








<hr>





<!-- ANIMATION -->


<h3>
ANIMATION
</h3>


<button onclick="addBounce()">
🪂 BOUNCE
</button>


<button onclick="addFloat()">
🌊 FLOAT
</button>


<button onclick="addPulse()">
✨ PULSE
</button>


<button onclick="stopAnimation()">
STOP
</button>





</div>









<!-- ==========================
WEBSITE
========================== -->


<div id="website">



<section 
class="page active"
data-page="1"
>



<div class="hero">



<h1 
class="editable textObject">

BANO KE

</h1>





<p 
class="editable textObject">

THE KING OF AFRICAN MARBLES

</p>






<img

src="assets/marble.png"

class="editable imageObject"

>






</div>


</section>




</div>








<script src="project.js"></script>

<script src="pages.js"></script>

<script src="background.js"></script>

<script src="animations.js"></script>

<script src="editor.js"></script>


</body>


</html>
