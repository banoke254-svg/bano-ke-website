<!DOCTYPE html>
<html>

<head>

<title>BANO KE Builder</title>

<link rel="stylesheet" href="style.css">


<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">


</head>


<body>


<!-- SAVE STATUS -->

<div id="saveStatus">
✓ Saved
</div>




<!-- EDITOR OPEN BUTTON -->

<button id="editorToggle">
🛠
</button>





<!-- EDITOR PANEL -->

<div id="editorPanel">


<h2>
BANO BUILDER
</h2>



<!-- PROJECT -->

<h3>
PROJECT
</h3>


<button onclick="saveProject()">
💾 SAVE PROJECT
</button>


<button onclick="loadProject()">
📂 LOAD PROJECT
</button>





<hr>





<!-- PAGE SYSTEM -->


<h3>
PAGES
</h3>



<button onclick="addPage()">
➕ NEW PAGE
</button>


<button onclick="removePage()">
🗑 REMOVE PAGE
</button>


<button onclick="previousPage()">
⬅ PREVIOUS
</button>


<button onclick="nextPage()">
NEXT ➡
</button>




<select id="pageTransition">


<option value="fade">
Fade
</option>


<option value="zoom">
Zoom
</option>


<option value="morph">
Morph
</option>


<option value="slide">
Slide
</option>


</select>






<hr>






<!-- BACKGROUND -->

<h3>
BACKGROUND
</h3>


<input

id="backgroundUpload"

type="file"

accept="image/*"

>



<button onclick="applyBackground()">
SET BACKGROUND
</button>



<button onclick="removeBackground()">
REMOVE BACKGROUND
</button>






<hr>







<!-- OBJECTS -->


<h3>
OBJECTS
</h3>


<button onclick="addText()">
➕ TEXT
</button>


<button onclick="addEmoji()">
🔥 EMOJI
</button>


<button onclick="addImage()">
🖼 IMAGE
</button>


<button onclick="addGlassPanel()">
⬜ GLASS PANEL
</button>




<button onclick="deleteSelected()">
🗑 DELETE
</button>



<button onclick="duplicateSelected()">
📋 DUPLICATE
</button>








<hr>







<!-- SIZE -->

<h3>
SIZE
</h3>



<label>
Width
</label>


<input

id="widthControl"

type="range"

min="20"

max="1200"

value="300"

>




<label>
Height
</label>


<input

id="heightControl"

type="range"

min="20"

max="1000"

value="200"

>






<label>
Text Size
</label>


<input

id="fontControl"

type="range"

min="10"

max="200"

value="50"

>







<hr>







<!-- GLASS SETTINGS -->


<h3>
GLASS
</h3>



<label>
Opacity
</label>


<input

id="opacityControl"

type="range"

min="0"

max="100"

value="50"

>




<label>
Blur
</label>


<input

id="blurControl"

type="range"

min="0"

max="60"

value="20"

>




<label>
Radius
</label>


<input

id="radiusControl"

type="range"

min="0"

max="100"

value="30"

>






<hr>







<!-- ANIMATION -->


<h3>
ANIMATION
</h3>



<button onclick="addBounce()">
🪂 BOUNCE
</button>



<button onclick="addFloat()">
🌊 FLOAT
</button>



<button onclick="addPulse()">
✨ PULSE
</button>



<button onclick="stopAnimation()">
STOP
</button>






</div>

<hr>


<h3>
MARBLE TRANSITION
</h3>


<label>

Enable Hero Marble

</label>


<input 
type="checkbox"
id="heroMarbleEnable"
>


<br><br>


<label>

Marble Position

</label>


<select id="marblePosition">


<option value="bottom-right">
Bottom Right
</option>


<option value="top-left">
Top Left
</option>


<option value="center">
Center
</option>


<option value="bottom-left">
Bottom Left
</option>


</select>




<br><br>



<label>

Motion Type

</label>


<select id="marbleMotion">


<option value="morph">
Morph
</option>


<option value="fly">
Fly
</option>


<option value="spiral">
Spiral
</option>


</select>





<br><br>


<label>

Speed

</label>


<input

type="range"

id="marbleSpeed"

min="500"

max="4000"

value="1800"

>




<label>

Rotation

</label>


<input

type="range"

id="marbleRotation"

min="0"

max="1440"

value="720"

>







<!-- WEBSITE -->

<div id="website">



<section class="page active" data-page="1">



<div class="hero">



<h1 class="editable textObject">

BANO KE

</h1>




<p class="editable textObject">

THE KING OF AFRICAN MARBLES

</p>




<img

src="assets/marble.png"

class="editable imageObject hero-marble"

>




</div>


</section>





</div>








<script src="project.js"></script>

<script src="pages.js"></script>

<script src="heroTransition.js"></script>

<script src="background.js"></script>

<script src="animations.js"></script>

<script src="editor.js"></script>



</body>


</html>
